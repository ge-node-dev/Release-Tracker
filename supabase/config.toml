[api]
enabled = true
schemas = ["public", "graphql_public"]

# Order matters: users.sql references releases from catalog_data.sql (generated by `yarn db:sync`).
[db.seed]
enabled = true
sql_paths = ["./seeds/catalog_data.sql", "./seeds/users.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/reset-password"]